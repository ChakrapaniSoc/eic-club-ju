<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registration | EMBEDEX</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1b2860,transparent 40%),#070b16;color:#f3f6ff;font:15px Arial}.wrap{max-width:720px;margin:55px auto;padding:20px}.box{background:#101a30;border:1px solid #34476b;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0008}h1{font-size:32px}.muted{color:#aebbd2;line-height:1.6}label{display:block;margin:15px 0 6px;color:#c8d3e8}input{width:100%;padding:13px;border-radius:9px;border:1px solid #394b6a;background:#080f20;color:white}button{padding:13px 20px;border:0;border-radius:25px;background:linear-gradient(90deg,#a04cff,#318eff);color:white;font-weight:bold;cursor:pointer;margin-top:20px}.event{padding:13px;border:1px solid #314363;border-radius:10px;margin:10px 0}.event label{display:flex;gap:10px;align-items:center;margin:0}.event input{width:auto}.status{margin-top:16px;color:#72e7d7}a{color:#76e7df}</style></head><body><div class="wrap"><a href="/">← Back to EMBEDEX</a><div class="box"><h1>Event Registration</h1><p class="muted">Register for one or more events in this programme. Complete all details carefully.</p><form id="form"><label>Full name</label><input name="name" required maxlength="120"><label>Roll number / PRN number</label><input name="roll_number" required maxlength="60"><label>Mobile number</label><input name="mobile" type="tel" required maxlength="18"><label>Email ID</label><input name="email" type="email" required maxlength="160"><h3>Select event(s)</h3><div id="events">Loading available events…</div><button type="submit">Submit registration →</button><div class="status" id="status" role="status"></div></form></div></div><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api?action=public&type=event');if(!r.ok)throw Error();const items=await r.json();const active=items.filter(x=>x.payload.registration!==false&&x.payload.status!=='past'&&!(x.payload.date&&Date.parse(x.payload.date)<Date.now()));document.getElementById('events').innerHTML=active.map(x=>'<div class="event"><label><input type="checkbox" name="event_ids" value="'+esc(x.id)+'"><span><b>'+esc(x.payload.title)+'</b><br><small>'+esc(x.payload.date||'')+' · '+esc(x.payload.venue||'')+'</small></span></label></div>').join('')||'No open events currently.'}catch{document.getElementById('events').textContent='Could not load events. Please try again later.'}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(['name','roll_number','mobile','email'].map(k=>[k,f.get(k)]));data.event_ids=f.getAll('event_ids');const s=document.getElementById('status');try{const r=await fetch('/api?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Registration failed');s.textContent=j.message+'!';e.target.reset()}catch(err){s.textContent=err.message}});load();
</script></body></html>
