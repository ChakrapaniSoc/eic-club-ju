<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIC Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b16;color:#eef3ff;font:15px Arial,sans-serif}a{color:#70e7df}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.panel,.card{background:#111a2c;border:1px solid #263858;border-radius:16px;padding:22px;margin:18px 0}.login{max-width:420px;margin:12vh auto}.hidden{display:none!important}input,textarea,select{width:100%;padding:12px;border:1px solid #334563;background:#080f20;color:white;border-radius:9px;margin:7px 0 15px}label{font-size:13px;color:#b7c4da}button{padding:11px 16px;border:0;border-radius:9px;background:linear-gradient(90deg,#9c52ff,#288dff);color:white;font-weight:bold;cursor:pointer;margin:4px}.danger{background:#9e304c}.tabs{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{border:1px solid #293a58;padding:14px;border-radius:12px;margin:10px 0}.item img{max-width:130px;max-height:90px;object-fit:cover;display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:15px}}
</style></head><body><div class="wrap"><div class="top"><h2>EMBEDEX · Admin Console</h2><a href="/">← View website</a></div>
<div id="login" class="panel login"><h2>Admin Login</h2><label>Username</label><input id="username" autocomplete="username" value="admin"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Sign in</button><p id="loginMsg"></p></div>
<div id="dash" class="hidden"><div class="panel"><h2>Website content manager</h2><p>Create, edit or delete events, members and achievements. Upload images directly to Supabase Storage.</p><div class="tabs"><button onclick="setType('event')">Events</button><button onclick="setType('member')">Members</button><button onclick="setType('achievement')">Achievements</button><button onclick="loadRegs()">Registrations</button><button onclick="logout()">Log out</button></div></div>
<div id="editor" class="panel"><h2 id="formTitle">Add event</h2><input id="itemId" type="hidden"><label>Title</label><input id="title" placeholder="Event or member name"><label>Description / role</label><textarea id="description" rows="3"></textarea><div class="grid"><div><label>Event status</label><select id="status"><option value="upcoming">Upcoming event</option><option value="past">Past event</option></select></div><div><label>Date (events)</label><input id="date" placeholder="e.g. 10 Nov 2026"></div><div><label>Venue / subtitle</label><input id="venue" placeholder="Venue or short label"></div></div><label>Image / poster</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><input id="imageUrl" placeholder="Or paste an existing image URL"><label>Winner photos (past events only — select multiple)</label><input id="winnerPhotoFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><label>Or paste winner photo URLs (one per line)</label><textarea id="winnerPhotoUrls" rows="3" placeholder="https://..."></textarea><label>Registration enabled</label><select id="registration"><option value="true">Yes</option><option value="false">No</option></select><button onclick="saveItem()">Save / publish</button><button class="danger" onclick="resetForm()">Clear form</button><p id="msg"></p></div>
<div class="panel"><h2 id="listTitle">Events</h2><div id="items"></div></div><div class="panel"><h2>Registration submissions</h2><div id="regs">Choose Registrations to load entries.</div></div></div></div>
<script>
let token=sessionStorage.getItem('eic_admin_token'),type='event',rows=[];
async function api(action,method='GET',data){const r=await fetch('/api?'+new URLSearchParams({action}),{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function login(){try{const r=await api('login','POST',{username:document.getElementById('username').value,password:document.getElementById('password').value});token=r.token;sessionStorage.setItem('eic_admin_token',token);showDash()}catch(e){document.getElementById('loginMsg').textContent=e.message}}
function showDash(){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');loadItems()}
function logout(){sessionStorage.removeItem('eic_admin_token');token=null;location.reload()}
function setType(t){type=t;document.getElementById('listTitle').textContent=t[0].toUpperCase()+t.slice(1)+'s';document.getElementById('formTitle').textContent='Add '+t;resetForm();loadItems()}
function resetForm(){['itemId','title','description','date','venue','imageUrl','winnerPhotoUrls'].forEach(x=>document.getElementById(x).value='');document.getElementById('photo').value='';document.getElementById('winnerPhotoFiles').value='';document.getElementById('status').value='upcoming';document.getElementById('registration').value='true';}
async function upload(){const f=document.getElementById('photo').files[0];if(!f)return document.getElementById('imageUrl').value.trim();if(f.size>5*1024*1024)throw Error('Image must be 5 MB or smaller');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});const out=await api('upload','POST',{filename:f.name,mime:f.type,data});return out.url}
async function uploadWinnerPhotos(){const files=[...document.getElementById('winnerPhotoFiles').files];const urls=document.getElementById('winnerPhotoUrls').value.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);for(const f of files){if(f.size>5*1024*1024)throw Error('Each winner photo must be 5 MB or smaller');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});const out=await api('upload','POST',{filename:f.name,mime:f.type,data});urls.push(out.url)}return urls}\nasync function saveItem(){const msg=document.getElementById('msg');try{const image=await upload(),winnerPhotos=await uploadWinnerPhotos(),status=document.getElementById('status').value;const payload={title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),date:document.getElementById('date').value.trim(),venue:document.getElementById('venue').value.trim(),image,winnerPhotos,status,registration:status==='past'?false:document.getElementById('registration').value==='true'};if(!payload.title)throw Error('Title is required');const id=document.getElementById('itemId').value;await api('items',id?'PUT':'POST',id?{id,type,payload}:{type,payload});msg.textContent='Saved successfully';resetForm();loadItems()}catch(e){msg.textContent=e.message}}
async function loadItems(){try{rows=await api('items');rows=rows.filter(x=>x.type===type);document.getElementById('items').innerHTML=rows.map(x=>'<div class="item">'+(x.payload.image?'<img src="'+esc(x.payload.image)+'">':'')+'<b>'+esc(x.payload.title||'')+'</b><p>'+esc(x.payload.description||'')+'</p><small>'+esc(x.payload.date||'')+' · '+esc(x.payload.status||'upcoming')+' · '+((x.payload.winnerPhotos||[]).length)+' winner photos</small><br><button onclick="editItem(\''+x.id+'\')">Edit</button><button class="danger" onclick="deleteItem(\''+x.id+'\')">Delete</button></div>').join('')||'No entries yet.'}catch(e){document.getElementById('items').textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editItem(id){const x=rows.find(r=>r.id===id);if(!x)return;document.getElementById('itemId').value=id;for(const [k,v] of Object.entries(x.payload))if(document.getElementById(k))document.getElementById(k).value=v??'';document.getElementById('status').value=x.payload.status||((x.payload.registration===false)?'past':'upcoming');document.getElementById('winnerPhotoUrls').value=(x.payload.winnerPhotos||[]).join('\\n');document.getElementById('formTitle').textContent='Edit '+type;window.scrollTo({top:0,behavior:'smooth'})}
async function deleteItem(id){if(!confirm('Delete this item?'))return;try{await api('items','DELETE',{id});loadItems()}catch(e){alert(e.message)}}
async function loadRegs(){try{const r=await api('registrations');document.getElementById('regs').innerHTML=r.map(x=>'<div class="item"><b>'+esc(x.name)+'</b> · '+esc(x.roll_number)+'<p>'+esc(x.email)+' · '+esc(x.mobile)+'</p><small>Event IDs: '+esc(JSON.stringify(x.event_ids))+'</small></div>').join('')||'No registrations yet.'}catch(e){document.getElementById('regs').textContent=e.message}}
if(token)showDash();
</script></body></html>
